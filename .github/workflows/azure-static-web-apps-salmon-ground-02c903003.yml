name: Website build and deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GROUND_02C903003 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs
        env:
          AZURE_SWA_NAME: ${{ vars.AZURE_SWA_NAME }}
          AZURE_SWA_RESOURCE_GROUP: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
        run: |
          : "${AZURE_SWA_NAME:?AZURE_SWA_NAME repository variable is not set}"
          : "${AZURE_SWA_RESOURCE_GROUP:?AZURE_SWA_RESOURCE_GROUP repository variable is not set}"

      - name: Delete preview environment
        env:
          SWA_NAME: ${{ vars.AZURE_SWA_NAME }}
          SWA_RG: ${{ vars.AZURE_SWA_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          BUILDS_URL="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${SWA_RG}/providers/Microsoft.Web/staticSites/${SWA_NAME}/builds?api-version=2022-03-01"

          echo "Current builds for SWA '${SWA_NAME}':"
          az rest --method GET --url "$BUILDS_URL" \
            --query "value[].{name:name, branch:sourceBranch, prTitle:pullRequestTitle, status:status}" \
            -o table

          # Preview env's API 'name' is the PR number (e.g. "29"). Portal label
          # "#29 - correct deletion" is just buildId + pullRequestTitle stitched.
          BUILD_NAME=$(az rest --method GET --url "$BUILDS_URL" \
            --query "value[?name=='${PR_NUMBER}'].name | [0]" -o tsv)

          # Fallback: match by source branch in case the build is named differently.
          if [ -z "$BUILD_NAME" ] || [ "$BUILD_NAME" = "null" ]; then
            BUILD_NAME=$(az rest --method GET --url "$BUILDS_URL" \
              --query "value[?sourceBranch=='${PR_BRANCH}' && name!='default'].name | [0]" -o tsv)
          fi

          if [ -z "$BUILD_NAME" ] || [ "$BUILD_NAME" = "null" ]; then
            echo "No preview environment matches PR #${PR_NUMBER} (branch '${PR_BRANCH}'). Nothing to delete."
            exit 0
          fi

          echo "Deleting preview environment '${BUILD_NAME}' (PR #${PR_NUMBER})..."
          DELETE_URL="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${SWA_RG}/providers/Microsoft.Web/staticSites/${SWA_NAME}/builds/${BUILD_NAME}?api-version=2022-03-01"
          az rest --method DELETE --url "$DELETE_URL"
          echo "Delete request accepted for build '${BUILD_NAME}'."
